<!doctype html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="ditto_agent.css">
  <script type="module" src="home.js"></script>
</head>
<body class="home">
  <main>
    <span class="logo" id="logo"></span>
    <form class="command" id="command">
      <span id="command-icon"></span>
      <input id="query" autocomplete="off" spellcheck="false" autofocus
             placeholder="Ask, or type an address" aria-label="Ask Ditto or open an address">
      <kbd>↵</kbd>
    </form>
    <ul class="recent" id="recent" aria-label="Recent chats"></ul>
    <div class="move" id="move"></div>
  </main>
</body>
</html>
