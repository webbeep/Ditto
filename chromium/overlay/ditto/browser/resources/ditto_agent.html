<!doctype html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <title>Ditto</title>
  <link rel="stylesheet" href="ditto_agent.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="panel">
    <header>
      <span class="logo" id="logo"></span>
      <span class="title" id="title"></span>
      <span id="header-actions"></span>
    </header>
    <section class="view" id="view-chat">
      <div class="thread" id="thread" aria-live="polite"></div>
    </section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-models" hidden></section>
    <section class="view" id="view-memory" hidden></section>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Ask anything" aria-label="Ask Ditto"></textarea>
      <div class="row">
        <div class="segmented" id="modes" role="group" aria-label="Agent mode"></div>
        <span id="send-slot"></span>
      </div>
    </form>
  </div>
</body>
</html>
