<!doctype html>
<html><head><meta charset="utf-8"><title>Book a table - Acme Bistro</title></head>
<body>
<main>
  <h1>Book a table</h1>
  <p>Acme Bistro, open Thursday to Saturday.</p>
  <form onsubmit="return false">
    <p><input id="name" aria-label="Name" placeholder="Your name"></p>
    <p><select id="day" aria-label="Day">
      <option>Thursday, Nov 6</option><option>Friday, Nov 7</option><option>Saturday, Nov 8</option>
    </select></p>
    <p><select id="party" aria-label="Party size">
      <option>2 people</option><option>3 people</option><option>4 people</option>
    </select></p>
    <p><button type="button" id="reserve"
       onclick="location.href = 'booked.html?' + new URLSearchParams({
         name: document.getElementById('name').value,
         day: document.getElementById('day').value,
         party: document.getElementById('party').value})">Reserve table</button></p>
  </form>
</main>
</body></html>
