name: Native build stage

# One link of the chained Chromium build (native-release.yml). A GitHub-
# hosted job runs at most 6 hours; the build takes longer, so each stage
# restores the previous stage's tree and build directory, builds for about
# five hours and saves its progress (scripts/ci-state.sh). The stage that
# finishes the build also packages and smoke-tests Ditto.app.
#
# Steps that fail do not stop the rest of Chromium from building: the stage
# saves its progress and then fails. After a fix, a new run with `resume`
# set to the same build state rebuilds only what changed.

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      config:
        type: string
        required: true
      # The draft release holding the build's state (scripts/ci-state.sh).
      state_tag:
        type: string
        required: true
      # Continue the build saved in `state_tag` instead of fetching Chromium.
      resume:
        type: boolean
        default: false
    outputs:
      done:
        value: ${{ jobs.stage.outputs.done }}

permissions:
  contents: write

jobs:
  stage:
    runs-on: macos-15
    timeout-minutes: 355
    outputs:
      done: ${{ steps.result.outputs.done }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DITTO_WORK_DIR: ${{ github.workspace }}/../ditto-build
      DITTO_STATE_TAG: ${{ inputs.state_tag }}
      CONFIG: ${{ inputs.config }}
      STAGE: ${{ inputs.stage }}
    steps:
      - name: Deadline
        # Build until 5 h 5 min into the job; saving takes up to ~30 min.
        run: echo "DEADLINE=$(( $(date +%s) + 305 * 60 ))" >> "$GITHUB_ENV"
      - name: Make room (Chromium needs ~80 GB)
        run: |
          newest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          for x in /Applications/Xcode*.app; do
            [ "$(readlink -f "$x")" = "$(readlink -f "$newest")" ] || sudo rm -rf "$x"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet \
            /Users/runner/hostedtoolcache/CodeQL || true
          df -h /System/Volumes/Data | cat
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install coreutils zstd >/dev/null
          gsplit --version | head -1; gtimeout --version | head -1; zstd --version
      - name: Fetch Chromium
        if: inputs.stage == 1 && !inputs.resume
        run: scripts/fetch.sh
      - name: Restore the build so far
        if: inputs.stage > 1 || inputs.resume
        run: |
          scripts/ci-state.sh restore tree
          scripts/ci-state.sh restore out || echo "No build output saved yet"
      - name: Ditto's sources and patches, gn gen
        if: inputs.stage == 1
        run: |
          scripts/ci-resync.sh "$CONFIG"
          # The tree once per run (without its build output or git history).
          scripts/ci-state.sh save tree --exclude src/out src depot_tools .gclient applied-patches
      - name: Build
        id: build
        run: |
          status=0
          scripts/ci-build-slice.sh "$CONFIG" "$DEADLINE" || status=$?
          case $status in
            0) echo "done=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "done=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "done=false" >> "$GITHUB_OUTPUT"; echo "failed=true" >> "$GITHUB_OUTPUT" ;;
          esac
          df -h /System/Volumes/Data | cat
      - name: Save progress
        if: steps.build.outputs.done == 'false'
        run: scripts/ci-state.sh save out "src/out/$CONFIG"
      - name: Report failed steps
        if: steps.build.outputs.failed == 'true'
        run: |
          grep -h -A30 '^FAILED:' "$DITTO_WORK_DIR/src/out/$CONFIG/siso_output" 2>/dev/null | head -400 || true
          echo "::error::Some build steps failed. Fix them, then run native-release again with resume: $DITTO_STATE_TAG"
          exit 1
      - name: Package
        if: steps.build.outputs.done == 'true'
        run: |
          arch=arm64; [ "$CONFIG" = mac-x64 ] && arch=x86_64
          scripts/build-runtime.sh "$arch"
          scripts/package-mac.sh "$CONFIG"
      - name: Smoke test
        if: steps.build.outputs.done == 'true' && inputs.config == 'mac-arm64'
        run: scripts/smoke-native.sh "$DITTO_WORK_DIR/src/out/$CONFIG/Ditto.app"
      - name: Hand the DMG to the release job
        if: steps.build.outputs.done == 'true'
        run: |
          scripts/ci-state.sh put "dist/Ditto-$CONFIG.dmg"
          scripts/ci-state.sh put "dist/Ditto-$CONFIG.dmg.sha256"
      - id: result
        run: echo "done=${{ steps.build.outputs.done }}" >> "$GITHUB_OUTPUT"
