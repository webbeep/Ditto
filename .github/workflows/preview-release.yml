name: Release

# Builds the downloadable Ditto app on GitHub's macOS runners and publishes
# it as the latest GitHub release (the links in README.md):
#   official open-source Chromium + Ditto agent extension + llama.cpp runtime
#   + Ditto launcher (preview/). Every build is smoke-tested, and the agent
#   must answer with real models from the built app, before release.
# Superseded by native-release.yml (the agent built into the browser); kept
# to rebuild the extension-based preview by hand.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0); created if missing
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag }}

jobs:
  build:
    name: Build and smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the agent
        working-directory: agent
        run: npm ci && npm run build
      - name: Build Ditto.app and the DMG
        run: preview/build-app.sh ${{ matrix.arch }}
      - name: Smoke test
        run: preview/smoke-test.sh build/preview-${{ matrix.arch }}/Ditto.app
      - uses: actions/upload-artifact@v4
        with:
          name: ditto-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  real-models:
    name: Agent with real models (arm64)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the agent
        working-directory: agent
        run: npm ci && npm run build
      - uses: actions/download-artifact@v4
        with:
          name: ditto-arm64
          path: dist
      - name: Install Ditto.app from the DMG
        run: |
          hdiutil attach dist/Ditto-mac-arm64.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/dmg/Ditto.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: Install Playwright (drives the test tab)
        run: |
          npm install -g playwright@1.63.0
          npx playwright install chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Run the agent with LFM3 1.7B + d1 Omni 600M
        run: preview/real-model-test.sh "$RUNNER_TEMP/Ditto.app"

  release:
    name: Publish release
    # Never publish a build whose agent cannot run real models.
    needs: [build, real-models]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          {
            cat preview/RELEASE_NOTES.md
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo "Built from ${GITHUB_SHA::7} with $(cat dist/chromium-version-arm64.txt)."
          } > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Ditto ${{ github.event.inputs.tag || github.ref_name }} (preview)
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/Ditto-mac-arm64.dmg
            dist/Ditto-mac-arm64.dmg.sha256
            dist/Ditto-mac-x64.dmg
            dist/Ditto-mac-x64.dmg.sha256
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
