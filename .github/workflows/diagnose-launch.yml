name: Diagnose launch

# Reproduces what a user sees when they download the latest release and
# open it: quarantine (as a browser sets it), Gatekeeper's verdict, the
# signature of the installed copy, then a normal GUI launch through
# LaunchServices with a screenshot, process list and crash reports.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: Launch (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the latest release, as a browser would
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "Ditto-mac-${{ matrix.arch }}.dmg" --dir "$RUNNER_TEMP"
          dmg="$RUNNER_TEMP/Ditto-mac-${{ matrix.arch }}.dmg"
          # The flag Safari/Chrome put on downloads.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$dmg"
          xattr -l "$dmg"
          sw_vers; uname -m
      - name: Install to /Applications
        run: |
          hdiutil attach "$RUNNER_TEMP/Ditto-mac-${{ matrix.arch }}.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          ls -la "$RUNNER_TEMP/dmg"
          rm -rf /Applications/Ditto.app
          cp -R "$RUNNER_TEMP/dmg/Ditto.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "--- quarantine on the installed app:"
          xattr -p com.apple.quarantine /Applications/Ditto.app || echo "(none)"
      - name: Gatekeeper and signature
        run: |
          echo "--- spctl (what Gatekeeper decides on first open):"
          spctl --assess --type execute -vvv /Applications/Ditto.app 2>&1 || true
          echo "--- codesign verify:"
          codesign --verify --deep --strict --verbose=2 /Applications/Ditto.app 2>&1 || echo "SIGNATURE INVALID"
          echo "--- codesign info:"
          codesign -dv /Applications/Ditto.app 2>&1 || true
          echo "--- Info.plist:"
          plutil -p /Applications/Ditto.app/Contents/Info.plist | grep -E "CFBundle(Executable|Identifier|Name|ShortVersion)|LSMinimum|CrProductDirName"
          echo "--- launcher binary:"
          file /Applications/Ditto.app/Contents/MacOS/*
      - name: Open the app (after "Open Anyway")
        run: |
          # What clicking "Open Anyway" amounts to for this check.
          xattr -dr com.apple.quarantine /Applications/Ditto.app
          open -a /Applications/Ditto.app
          sleep 25
          echo "--- processes:"
          pgrep -fl "Ditto.app" || echo "NO DITTO PROCESSES"
          echo "--- windows:"
          osascript -e 'tell application "System Events" to get name of every window of (every process whose name is "Ditto" or name is "Chromium")' 2>&1 || true
          screencapture -x "$RUNNER_TEMP/screen.png" || true
      - name: Logs and crash reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cp "$RUNNER_TEMP/screen.png" "$RUNNER_TEMP/diag/" 2>/dev/null || true
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -iE "ditto|chromium" || echo "no crash reports"
          cp ~/Library/Logs/DiagnosticReports/*{Ditto,Chromium}* "$RUNNER_TEMP/diag/" 2>/dev/null || true
          log show --last 3m --style compact --predicate 'process == "Ditto" OR process == "Chromium" OR (process == "syspolicyd") OR (process == "launchd" AND eventMessage CONTAINS "Ditto")' 2>/dev/null | tail -150 > "$RUNNER_TEMP/diag/system.log" || true
          tail -60 "$RUNNER_TEMP/diag/system.log" || true
          ls -la ~/Library/Application\ Support/Ditto 2>/dev/null || echo "no profile directory"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.arch }}
          path: ${{ runner.temp }}/diag/
