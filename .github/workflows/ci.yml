name: CI

on:
  push:
  pull_request:

jobs:
  agent:
    name: Agent + pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The dev browser bridge resolves Playwright from the global modules
      # (see agent/dev/playwright_cdp.ts).
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: npm test
      - name: Pages build with the app's bridge
        run: node ../web/build.mjs webkit "$RUNNER_TEMP/web"

  app:
    name: App compiles
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path app
