name: CI

on:
  push:
  pull_request:

jobs:
  agent:
    name: Agent runtime + WebUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The dev browser bridge resolves Playwright from the global modules
      # (see agent/dev/playwright_cdp.ts).
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: npm test
      - run: ../tools/webui-typecheck/check.sh

  patches:
    name: Chromium patches apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-patches.sh
