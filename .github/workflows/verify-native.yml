name: Verify native code

# Fetches Chromium, applies Ditto's patches and compiles Ditto's native code
# and every patched Chromium file (scripts/verify-native.sh) on a GitHub
# macOS runner. About 1-2 hours, versus 15+ for the whole browser.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      DITTO_WORK_DIR: ${{ github.workspace }}/../ditto-build
    steps:
      - name: Make room (Chromium needs ~60 GB)
        run: |
          df -h /System/Volumes/Data | cat
          newest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Keeping $newest"
          sudo xcode-select -s "$newest"
          for x in /Applications/Xcode*.app; do
            [ "$(readlink -f "$x")" = "$(readlink -f "$newest")" ] || sudo rm -rf "$x"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet \
            /Users/runner/hostedtoolcache/CodeQL || true
          df -h /System/Volumes/Data | cat
          xcodebuild -version
      - uses: actions/checkout@v4
      - name: Fetch Chromium (macOS only, no history)
        run: scripts/fetch.sh
      - name: Patch, gn gen, gn check, compile Ditto's code
        run: scripts/verify-native.sh mac-arm64
      - name: Disk used
        if: always()
        run: df -h /System/Volumes/Data | cat
