name: Probe runner

# Reports the disk, CPU and memory of GitHub's macOS runners, to plan the
# full Chromium build (it needs ~100 GB and many CPU hours).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    steps:
      - run: |
          sw_vers; uname -m
          echo "cpus: $(sysctl -n hw.ncpu)  mem: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          df -h / /System/Volumes/Data | cat
          ls /Applications | grep -i xcode
          du -sh /Applications/Xcode*.app 2>/dev/null | cat
          du -sh ~/Library/Android 2>/dev/null | cat
          du -sh /usr/local/share/dotnet /Users/runner/hostedtoolcache 2>/dev/null | cat
